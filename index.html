<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לב טוב | שדרוג פרופיל</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e11d48;
            --primary-hover: #be123c;
            --secondary-color: #2563eb;
            --secondary-hover: #1d4ed8;
            --bg-glass: rgba(255, 255, 255, 0.1);
            --border-glass: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e3a8a, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow: hidden;
            padding: 20px;
        }

        /* רקע דינמי מונפש */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* עיגולים מטושטשים ברקע לעומק */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
        }
        .blob-1 {
            width: 300px;
            height: 300px;
            background: #e11d48;
            top: -100px;
            right: -100px;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite;
        }
        .blob-2 {
            width: 400px;
            height: 400px;
            background: #2563eb;
            bottom: -150px;
            left: -100px;
            border-radius: 50%;
            animation: float 12s ease-in-out infinite reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(30px) scale(1.1); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* כרטיס התוכן */
        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
            position: relative;
            z-index: 1;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* סמל הלב */
        .icon-container {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.5rem auto;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.4);
            animation: heartbeat 2s infinite;
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            fill: var(--primary-color);
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* טיפוגרפיה */
        .card h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .card h1 strong {
            font-weight: 600;
            color: #fff;
            text-decoration: line-through;
            text-decoration-color: rgba(255,255,255,0.5);
            text-decoration-thickness: 2px;
        }

        .card h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            color: #fff;
        }

        .highlight {
            color: var(--primary-color);
            text-shadow: 0 0 15px rgba(225, 29, 72, 0.5);
        }

        .card p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* כפתורים */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:hover svg {
            transform: scale(1.2);
        }

        /* אנימציית הופעה לכפתורים */
        .btn {
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }
        
        .btn:nth-child(1) { animation-delay: 0.8s; }
        .btn:nth-child(2) { animation-delay: 1s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* התאמה למסכים קטנים */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }
            .card h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- אלמנטים עיצוביים ברקע -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="card">
        <div class="icon-container">
            <!-- SVG של לב -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
        
        <h1>היי, אני בעבר <strong>מוח קודח</strong></h1>
        <h2>עברתי שדרוג ל<span class="highlight">'לב טוב'</span> ✨</h2>
        
        <p>שמח לראות אתכם כאן! כעת תוכלו למצוא את התכנים שלי, הפרויקטים והפעילות בכתובות הבאות:</p>
        
        <div class="buttons-container">
            <a href="https://lev-good.github.io/Good-heart/" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                <!-- SVG של בית/אתר -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                האתר החדש שלי
            </a>
            
            <a href="https://mitmachim.top/user/%D7%9C%D7%91-%D7%98%D7%95%D7%91" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
                <!-- SVG של משתמש/פרופיל -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                הפרופיל במתמחים טופ
            </a>
        </div>
    </div>

</body>
</html>
